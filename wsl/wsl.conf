# /etc/wsl.conf - Einstellungen für DIESE Ubuntu-Distribution (nicht global; global ist .wslconfig auf Windows).
# install.sh (Schritt 11) kopiert diese Datei nach /etc/wsl.conf und ersetzt __USER__ durch deinen
# Linux-Benutzernamen. Änderungen gelten erst nach einem WSL-Neustart: in PowerShell "wsl --shutdown"
# ausführen, dann Ubuntu neu öffnen.
# Referenz mit allen Schlüsseln: https://learn.microsoft.com/windows/wsl/wsl-config

# systemd als Init-System, damit Dienste per systemctl laufen wie auf einem normalen Ubuntu.
[boot]
systemd=true

# Benutzer, mit dem jede WSL-Sitzung startet (statt root).
[user]
default=__USER__

# Windows-Programme bleiben aus Ubuntu heraus aufrufbar (code, explorer.exe, clip.exe, wsl.exe).
[interop]
appendWindowsPath=true
